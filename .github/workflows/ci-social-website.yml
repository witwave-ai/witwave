name: CI — Social Website

on:
  pull_request:
    paths:
      - "social/website/**"
      - "social/papers/**"
      - "social/posts/**"
      - "scripts/generate-social-static-pages.mjs"
      - "scripts/render-social-whitepaper-lists.mjs"
      - "scripts/build-whitepaper-pdfs.sh"
      - "scripts/print-whitepaper-pdf.mjs"
      - "scripts/sync-social-website.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-social-website.yml"
  push:
    branches: [main]
    paths:
      - "social/website/**"
      - "social/papers/**"
      - "social/posts/**"
      - "scripts/generate-social-static-pages.mjs"
      - "scripts/render-social-whitepaper-lists.mjs"
      - "scripts/build-whitepaper-pdfs.sh"
      - "scripts/print-whitepaper-pdf.mjs"
      - "scripts/sync-social-website.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-social-website.yml"

concurrency:
  group: ci-social-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: static site + whitepaper PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # pandoc left unpinned: apt-provided, runner-stable. An exact
          # pkg=version pin against the GitHub runner's apt index is brittle —
          # the universe-pocket version moves on image refreshes and a stale
          # pin fails install with "Version not found". The Ubuntu 24.04 archive
          # currently ships 3.1.3+ds-2; pin here only if it becomes load-bearing.
          sudo apt-get install -y -qq pandoc
          npm ci

      - name: Verify generated whitepaper rows
        run: |
          set -euo pipefail
          node scripts/render-social-whitepaper-lists.mjs
          git diff --exit-code -- social/website/index.html social/website/whitepapers/index.html

      - name: Build publish artifact
        run: scripts/sync-social-website.sh /tmp/witwave-social-site

      - name: Verify whitepaper PDFs
        run: |
          set -euo pipefail
          expected=(
            /tmp/witwave-social-site/whitepapers/three-phases-of-ai-adoption/three-phases-of-ai-adoption.pdf
            /tmp/witwave-social-site/whitepapers/anatomy-of-an-agentic-team/anatomy-of-an-agentic-team.pdf
            /tmp/witwave-social-site/whitepapers/tool-boundaries-for-containerized-agents/tool-boundaries-for-containerized-agents.pdf
            /tmp/witwave-social-site/whitepapers/the-autonomy-boundary/the-autonomy-boundary.pdf
          )

          for pdf in "${expected[@]}"; do
            if [ ! -s "$pdf" ]; then
              echo "::error::missing generated PDF: $pdf"
              exit 1
            fi
            file "$pdf"
          done
