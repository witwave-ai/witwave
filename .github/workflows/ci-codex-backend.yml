name: CI — Codex Backend

on:
  pull_request:
    paths:
      - "backends/codex/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ci-codex-backend.yml"
  push:
    branches: [main]
    paths:
      - "backends/codex/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ci-codex-backend.yml"

concurrency:
  group: ci-codex-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends/codex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backends/codex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        working-directory: ${{ github.workspace }}
        run: |
          npx --yes prettier@3.4.2 --check \
            backends/codex/main.js \
            backends/codex/otel.js \
            backends/codex/test_codex_backend.js \
            backends/codex/package.json \
            backends/codex/README.md \
            .github/workflows/ci-codex-backend.yml

      - name: Unit tests
        run: npm test

      - name: Build runtime image
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            --build-arg BACKEND_BASE_IMAGE=ghcr.io/witwave-ai/images/backend-base:latest \
            -f backends/codex/Dockerfile \
            -t codex:ci .

      - name: Verify runtime image identity
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(docker run --rm codex:ci id -un)" = "agent"
          docker run --rm codex:ci node --version | grep -E '^v20\.'

      - name: Smoke runtime image
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm \
            -e CODEX_STUB_MODE=true \
            -e CODEX_SHELL_ENABLED=true \
            -e CONVERSATIONS_AUTH_DISABLED=true \
            -e METRICS_ENABLED=true \
            -e METRICS_PORT=9000 \
            -p 18081:8000 \
            -p 19081:9000 \
            codex:ci)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then
              break
            fi
            sleep 0.5
          done

          curl -fsS http://127.0.0.1:18081/health/ready >/dev/null
          session_id="00000000-0000-4000-8000-0000000000c1"
          timeout 5 curl -fsS -N "http://127.0.0.1:18081/api/sessions/${session_id}/stream" > /tmp/codex-sse.txt &
          sse_pid=$!
          for _ in $(seq 1 20); do
            if grep 'stream-start' /tmp/codex-sse.txt >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          grep 'stream-start' /tmp/codex-sse.txt >/dev/null
          curl -fsS -X POST http://127.0.0.1:18081/ \
            -H "content-type: application/json" \
            --data "{\"jsonrpc\":\"2.0\",\"id\":\"ci\",\"method\":\"message/send\",\"params\":{\"message\":{\"metadata\":{\"session_id\":\"${session_id}\"},\"parts\":[{\"kind\":\"text\",\"text\":\"hello\"}]}}}" \
            | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const j = JSON.parse(data); const text = j.result?.parts?.[0]?.text || ""; if (!text.includes("CODEX_STUB_MODE")) process.exit(1); });'
          wait "$sse_pid" || true
          grep 'event: conversation.chunk' /tmp/codex-sse.txt >/dev/null
          curl -fsS http://127.0.0.1:19081/metrics | grep 'backend_up{.*backend="codex"' >/dev/null
